name: Zbuduj APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Budowanie
        run: gradle assembleDebug --stacktrace

      - name: Przygotuj plik
        run: cp app/build/outputs/apk/debug/app-debug.apk NoirKamera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NoirKamera
          path: NoirKamera.apk

      - name: Publikacja (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Noir Kamera – wersja ${{ github.run_number }}
          body: Pobierz plik NoirKamera.apk na telefon i zainstaluj.
          files: NoirKamera.apk
          make_latest: true
